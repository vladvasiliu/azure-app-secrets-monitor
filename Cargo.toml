[package]
name = "azure-app-secrets-monitor"
version = "0.3.2"
edition = "2024"
authors = ["Vlad Vasiliu"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
chrono = "0.4"
config = { version = "0.15", features = ["ini"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
prometheus-client = "0.25"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "parking_lot", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "smallvec"] }
#graph-rs-sdk = "0.2"

[profile.release]
lto = true
incremental = false
codegen-units = 1
panic = "abort"
strip = true
