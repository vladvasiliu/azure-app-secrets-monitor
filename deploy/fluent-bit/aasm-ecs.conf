# FireLens custom configuration for azure-app-secrets-monitor.
#
# Turns each record FireLens receives into an ECS document:
# - parses the app's JSON log line (it already follows ECS),
# - renames the metadata FireLens adds to its ECS equivalent.
#
# Loaded by the log router with:
#   "config-file-type": "s3",
#   "config-file-value": "arn:aws:s3:::<bucket>/fluent-bit/aasm-ecs.conf"
#
# The output (Elasticsearch) stays in the app container's logConfiguration.
#
# Needs aws-for-fluent-bit 3.x (tested with 3.4.18, Fluent Bit 5.0.9). The
# `stable` tag still ships Fluent Bit 1.9, whose es output has no
# Write_Operation and so cannot write to data streams.

# The config FireLens generates doesn't load any parsers, so the `json` parser
# used below has to be loaded here (as the image's own parse-json.conf does).
[SERVICE]
    Parsers_File /fluent-bit/parsers/parsers.conf

# FireLens puts the raw line in `log`. It becomes `message` first, so that a
# line which isn't JSON (e.g. a panic) still lands in the ECS `message` field.
# The app's own JSON also has a `log` object, which parsing brings back.
[FILTER]
    Name   modify
    Match  azure-app-secrets-exporter-firelens-*
    Rename log message

# On success the parsed fields replace `message`; on failure the record is
# left as is.
[FILTER]
    Name         parser
    Match        azure-app-secrets-exporter-firelens-*
    Key_Name     message
    Parser       json
    Reserve_Data On

# FireLens ECS metadata, renamed to ECS fields. Dotted keys are expanded into
# objects by Elasticsearch.
[FILTER]
    Name   modify
    Match  azure-app-secrets-exporter-firelens-*
    Rename container_id        container.id
    Rename container_name      container.name
    Rename ecs_cluster         orchestrator.cluster.name
    Rename ecs_task_arn        orchestrator.resource.id
    Rename ecs_task_definition aws.ecs.task_definition
    Rename source              labels.stream
    Rename ec2_instance_id     cloud.instance.id
    Add    orchestrator.type          ecs
    Add    orchestrator.resource.type task
    Add    cloud.provider             aws
